name: 更新 README 开源项目

on:
  schedule:
    # 每月 1 日 UTC 02:00（北京时间 10:00）执行一次
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-projects
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 扫描新仓库并更新 README
        id: scan
        run: python .github/scripts/update_projects.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: sdise
          README_PATH: README.md
          SECTION_TITLE: '## 开源项目'

      - name: 提交更改
        if: steps.scan.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: README 开源项目新增 ${{ steps.scan.outputs.count }} 个仓库"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: 汇总
        if: always()
        run: |
          echo "changed=${{ steps.scan.outputs.changed }}"
          echo "count=${{ steps.scan.outputs.count }}"
